# Full stack: PostgreSQL + NestJS backend + React (nginx) frontend.
#   docker compose up --build
# Then open http://localhost:5173 and log in as admin@example.com / Admin@123
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store_rating
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d store_rating']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/store_rating
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_EXPIRY: 1d
      CORS_ORIGIN: http://localhost:5173
      ADMIN_NAME: System Administrator
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin@123
    ports:
      - '3000:3000'
    # Apply migrations and seed the default admin, then start the API.
    command: sh -c "npm run migration:run && npm run seed && node dist/main.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  pgdata:
