# Full stack: PostgreSQL + NestJS backend + React (nginx) frontend.
#   docker compose up --build
# Then open http://localhost:5173 and log in as admin@example.com / Admin@123
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store_rating
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d store_rating']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Production mode disables the public Swagger UI (see backend/src/main.ts).
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/store_rating
      # Override before deploying: `export JWT_SECRET=...` (or set it in a .env file
      # next to this compose file). The demo default below only keeps `docker compose
      # up` working out of the box — it is NOT safe for a real deployment.
      JWT_SECRET: ${JWT_SECRET:-pX9c2mQ7vL4hT8nR1eW6kA3sD0fG5jZbY2uH7iC4oM8qN6rB}
      JWT_EXPIRY: 1d
      CORS_ORIGIN: http://localhost:5173
      ADMIN_NAME: System Administrator
      ADMIN_EMAIL: admin@example.com
      # Demo default — override via `export ADMIN_PASSWORD=...` before deploying.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - '3000:3000'
    # Apply migrations and seed the default admin, then start the API.
    command: sh -c "npm run migration:run && npm run seed && node dist/main.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  pgdata:
